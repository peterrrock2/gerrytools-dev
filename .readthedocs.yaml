# .readthedocs.yaml
version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"
    # The package builds from source with the maturin backend, so RTD needs cargo.
    rust: "1.86"

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - mgrp
        - docs

sphinx:
  builder: dirhtml
  configuration: user_guide/conf.py

formats:
  - pdf
