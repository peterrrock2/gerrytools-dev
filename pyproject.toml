[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "gerrytools"
version = "2.0.0"
description = "Tools for processing and visualizing districting plans."
readme = "README.md"
authors = [
  { name = "Data and Democracy Research Initiative", email = "code@mggg.org" },
]
requires-python = ">=3.11"
license = "BSD-3-Clause"

dependencies = [
  # Working with graphs and ensembles
  "networkx>=3.5.0",
  "gerrychain @ git+https://github.com/mggg/GerryChain.git@dbce5dfedda7bf6258cfd47feed38ad34d693a7c",
  "binary-ensemble==2.0.0",
  # Data manipulation
  "pandas>=2.3.2",
  "scipy>=1.16.1",
  "numpy>=2.3.2",
  "pyarrow>=22.0.0",
  # Geospatial libraries
  "geopandas>=1.1.1",
  "pyproj>=3.6",
  "Shapely>=2.0.0",
  # Visualization
  "matplotlib>=3.10.6",
  "seaborn>=0.13.2",
  # Census
  "us>=3.2.0",
  "httpx>=0.28.0",
  "frozendict>=2.4.0",
  "tqdm>=4.67.0",
  # Misc
  "joblib>=1.5.3",
]

[dependency-groups]
dev = [
  "docker>=7.1.0",
  "hypothesis>=6.0",
  "ipykernel>=6.30.1",
  "ipywidgets>=8.1.7",
  "pillow>=11.0",
  "pytest>=8.4.2",
  "pytest-cov>=6.3.0",
  "pytest-timeout>=2.4.0",
  "pre-commit>=4.3.0",
  "ruff>=0.14.9",
  "ty>=0.0.3",
  "pyright>=1.1.411",
]
docs-exec = [
  "ipykernel>=6.30.1",
  "jupyter-cache>=1.0.1",
  "maup>=2.0.3",  # not imported by the package; taught in the geometry notebook
  "nbclient>=0.10.0",
  "nbformat>=5.10.0",
  "pytest>=8.4.2",
]
tex = [
    "pymupdf>=1.26.6",
    "pypdfium2>=5.1.0",
    "pyqt6>=6.10.0",
    "pyside6>=6.10.1",
]

[project.optional-dependencies]
mgrp = [
    "docker>=7.1.0",
]
# Renders the hosted docs; an extra (not a dependency group) so Read the Docs can install it
# via extra_requirements.
docs = [
  "furo>=2024.8.6",
  "maup>=2.0.3",
  "myst-nb>=1.4.0",
  "sphinx>=8.2.3",
  "sphinx-autobuild>=2024.10.3",
  "sphinx-copybutton>=0.5.2",
  "sphinx-design>=0.6.1",
]

[tool.uv]
default-groups = ["dev", "docs-exec"]

[tool.ruff]
line-length = 100
extend-exclude = [
  "dev_files"
]

[tool.ruff.lint]
select = ["E", "W", "F"]
ignore = [
    "E501",  # line length handled by Ruff's formatter
    "E203",  # formatter-compatible whitespace before ':'
    "E731",  # do not assign lambda expression
    "F541",  # f-string is missing placeholders
]
task-tags = ["TODO", "FIXME", "XXX", "HACK", "NOTE", "FIX", "BUG"]

[tool.ruff.lint.pycodestyle]
ignore-overlong-task-comments = true

[tool.ty]

[tool.ty.src]
include = ["gerrytools", "tests"]

[tool.ty.terminal]
output-format = "concise"
# error-on-warning = true  # optional: fail CI on warnings too

[tool.ty.environment]
python-version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
markers = [
  "latex: marks tests that require LaTeX installation and are included with '--with-latex'",
  "snapshot: marks snapshot/image-regression tests and are included with '--with-snapshot'",
  "mgrp_live: marks live mgrp Docker tests gated by MGRP_TEST_IMAGE",
]

[tool.coverage.run]
branch = true
source = ["gerrytools"]

[tool.coverage.report]
fail_under = 95
show_missing = true

[tool.maturin]
features = ["python"]
manifest-path = "rust/Cargo.toml"
module-name = "gerrytools._scoring_engine"
python-source = "."
